&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;

  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }

      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {

          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||

      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)

      privateContent: null,

        reject(persistenceError());

  const connectorGlobals = {};

    const values = new Map(Object.entries(parse(mockElement.textContent)));
    mockElement.remove();
    connectorGlobals.visualizationData = {
      updates: Array.from(values, ([name, value]) =&gt; ({
        name,
        revision: 1,
        state: &quot;ready&quot;,
        value: { type: &quot;json&quot;, value },
      })),
    };
    connectorGlobals.visualization = {
      /** @param {string} name @param {(value: unknown) =&gt; void} callback */
      onData(name, callback) {
        if (typeof callback !== &quot;function&quot;) {
          throw new TypeError(&quot;onData requires a callback&quot;);
        }
        try {
          callback(values.get(name));
        } catch (error) {
          // oxlint-disable-next-line no-console -- Keep authored callback failures local.
          console.error(&quot;Live visualization data callback failed&quot;, error);
        }
        // A static preview delivers the current fixture once per subscription.
        return () =&gt; {};
      },
    };
  }
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }

  });

  syncTheme();
})();

    #flow-styles-root {
      color-scheme: light;
      --lab-bg: #f5f5f7;
      --lab-surface: #fcfcfd;
      --lab-card: #ffffff;
      --lab-soft: #fcfcfd;
      --lab-text: #000000;
      --lab-muted: #808080;
      --lab-border: rgba(0, 0, 0, .1);
      --lab-track: #ececec;
      --lab-green: #12e415;
      --lab-orange: #ff9500;
      --lab-blue: #3f82e6;
      --lab-shadow: 0 1px 3px rgba(0, 0, 0, .04);
      --fd-slider-fill: #b3b3b6;
      --fd-slider-rest: #e1e1e3;
      --fd-slider-thumb: #a3a3a6;
      --fd-accent: #12e415;
      --fd-flow-edge: rgba(157, 255, 0, 0);
      --fd-flow-start: #9dff00;
      --fd-flow-main: #12e415;
      --fd-flow-end: #11e614;
      --fd-flow-start-at: 22%;
      --fd-flow-main-at: 55%;
      --fd-track-fade-in: 16%;
      --fd-track-fade-out: 84%;
      box-sizing: border-box;
      width: 100%;
      max-width: none;
      min-height: 100vh;
      padding: 54px 18px 48px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      overflow-x: clip;
      background: var(--lab-bg);
      color: var(--lab-text);
      font-family: &quot;SF Pro Display&quot;, &quot;SF Pro Text&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;
    }

    #flow-styles-root[data-flow-color=&quot;orange&quot;] {
      --fd-accent: #ff9500;
      --fd-flow-edge: rgba(255, 247, 0, 0);
      --fd-flow-start: rgba(255, 247, 0, .36);
      --fd-flow-main: #ff9500;
      --fd-flow-end: #ff7300;
      --fd-flow-start-at: 15%;
      --fd-flow-main-at: 36%;
    }

    #flow-styles-root *,
    #flow-styles-root *::before,
    #flow-styles-root *::after {
      box-sizing: border-box;
    }

    #flow-styles-root button,
    #flow-styles-root input {
      font: inherit;
    }

    #flow-styles-root,
    #flow-styles-root * {
      font-family: &quot;SF Pro Display&quot;, &quot;SF Pro Text&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif !important;
    }

    #flow-styles-root .fd-lab-app {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 880px;
      height: auto;
      min-height: 0;
      margin-inline: auto;
      overflow: visible;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    #flow-styles-root .fd-lab-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-start;
      gap: 14px;
      padding: 0 2px 19px;
      border-bottom: 0;
    }

    #flow-styles-root .fd-lab-eyebrow {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 4px;
      color: var(--lab-muted);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    #flow-styles-root .fd-lab-dot {
      width: 6px;
      height: 6px;
      flex: none;
      border-radius: 50%;
      background: var(--fd-accent);
    }

    #flow-styles-root h1 {
      margin: 0;
      color: var(--lab-text);
      font-size: 24px;
      font-weight: 500;
      line-height: 1.15;
    }

    #flow-styles-root .fd-header-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    #flow-styles-root .fd-color-group {
      display: inline-flex;
      flex: none;
      padding: 3px;
      border: 1px solid var(--lab-border);
      border-radius: 10px;
      background: rgba(0, 0, 0, .035);
    }

    #flow-styles-root .fd-color-button {
      display: inline-flex;

              &lt;label class=&quot;fd-color-field&quot;&gt;
                &lt;span class=&quot;fd-color-field-head&quot;&gt;&lt;span&gt;Start Pos&lt;/span&gt;&lt;output id=&quot;fd-param-ac-start-position&quot; data-unit=&quot;%&quot;&gt;12%&lt;/output&gt;&lt;/span&gt;
                &lt;input class=&quot;fd-param-range&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;45&quot; step=&quot;1&quot; value=&quot;12&quot; data-param=&quot;acGradientStartPosition&quot; aria-label=&quot;AC transition position&quot;&gt;
              &lt;/label&gt;
              &lt;label class=&quot;fd-color-field&quot;&gt;
                &lt;span class=&quot;fd-color-field-head&quot;&gt;&lt;span&gt;Alpha&lt;/span&gt;&lt;output id=&quot;fd-param-ac-opacity&quot; data-unit=&quot;%&quot;&gt;24%&lt;/output&gt;&lt;/span&gt;
                &lt;input class=&quot;fd-param-range&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;1&quot; value=&quot;24&quot; data-param=&quot;acGradientStartOpacity&quot; aria-label=&quot;AC transition opacity&quot;&gt;
              &lt;/label&gt;
              &lt;label class=&quot;fd-color-field is-color&quot;&gt;
                &lt;span class=&quot;fd-color-field-label&quot;&gt;Main&lt;/span&gt;
                &lt;span class=&quot;fd-color-swatch-row&quot;&gt;
                  &lt;input class=&quot;fd-color-input&quot; type=&quot;color&quot; value=&quot;#ff9500&quot; data-color-param=&quot;acGradientMain&quot; aria-label=&quot;AC main gradient color&quot;&gt;
                  &lt;output id=&quot;fd-color-ac-main&quot;&gt;#FF9500&lt;/output&gt;
                &lt;/span&gt;
              &lt;/label&gt;
              &lt;label class=&quot;fd-color-field&quot;&gt;
                &lt;span class=&quot;fd-color-field-head&quot;&gt;&lt;span&gt;Main Pos&lt;/span&gt;&lt;output id=&quot;fd-param-ac-main-position&quot; data-unit=&quot;%&quot;&gt;36%&lt;/output&gt;&lt;/span&gt;
                &lt;input class=&quot;fd-param-range&quot; type=&quot;range&quot; min=&quot;20&quot; max=&quot;75&quot; step=&quot;1&quot; value=&quot;36&quot; data-param=&quot;acGradientMainPosition&quot; aria-label=&quot;AC main gradient position&quot;&gt;
              &lt;/label&gt;
              &lt;label class=&quot;fd-color-field is-color&quot;&gt;
                &lt;span class=&quot;fd-color-field-label&quot;&gt;End&lt;/span&gt;
                &lt;span class=&quot;fd-color-swatch-row&quot;&gt;
                  &lt;input class=&quot;fd-color-input&quot; type=&quot;color&quot; value=&quot;#ff7300&quot; data-color-param=&quot;acGradientEnd&quot; aria-label=&quot;AC gradient end color&quot;&gt;
                  &lt;output id=&quot;fd-color-ac-end&quot;&gt;#FF7300&lt;/output&gt;
                &lt;/span&gt;
              &lt;/label&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/section&gt;
    &lt;/section&gt;

  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&quot;flow-styles-root&quot;);
      if (!root) return;

      const curveDefaults = {
        minLineWidth: 2,
        maxLineWidth: 5,
        trackWidth: 5,
        minSpeed: 12,
        maxSpeed: 90,
        segmentLength: 70,
        lineOverlap: 35,
        curveExponent: 0.7,
        trackColor: &quot;#ECECEC&quot;,
        trackFadeIn: 24,
        trackFadeOut: 76,
        dcGradientStart: &quot;#9DFF00&quot;,
        dcGradientMain: &quot;#12E415&quot;,
        dcGradientEnd: &quot;#11E614&quot;,
        dcGradientStartPosition: 22,
        dcGradientMainPosition: 55,
        dcGradientOpacity: 100,
        acGradientStart: &quot;#FFF700&quot;,
        acGradientMain: &quot;#FF9500&quot;,
        acGradientEnd: &quot;#FF7300&quot;,
        acGradientStartPosition: 12,
        acGradientMainPosition: 36,
        acGradientStartOpacity: 24
      };
      const curveConfigVersion = 5;
      const shapeNames = [&quot;straight&quot;, &quot;lshape&quot;, &quot;sshape&quot;];
      const state = {
        modelMax: 50,
        batteryPower: 14.13,
        flowColor: &quot;green&quot;,
        pathShape: &quot;straight&quot;,
        isPaused: false,
        ...curveDefaults
      };
      const curveParameterKeys = [
        &quot;minLineWidth&quot;,
        &quot;maxLineWidth&quot;,
        &quot;trackWidth&quot;,
        &quot;minSpeed&quot;,
        &quot;maxSpeed&quot;,
        &quot;segmentLength&quot;,
        &quot;lineOverlap&quot;,
        &quot;curveExponent&quot;,
        &quot;trackColor&quot;,
        &quot;trackFadeIn&quot;,
        &quot;trackFadeOut&quot;,
        &quot;dcGradientStart&quot;,
        &quot;dcGradientMain&quot;,
        &quot;dcGradientEnd&quot;,
        &quot;dcGradientStartPosition&quot;,
        &quot;dcGradientMainPosition&quot;,
        &quot;dcGradientOpacity&quot;,
        &quot;acGradientStart&quot;,
        &quot;acGradientMain&quot;,
        &quot;acGradientEnd&quot;,
        &quot;acGradientStartPosition&quot;,
        &quot;acGradientMainPosition&quot;,
        &quot;acGradientStartOpacity&quot;
      ];

      try {
        const saved = globalThis.openai &amp;&amp; globalThis.openai.widgetState;
        const privateState = saved &amp;&amp; saved.privateContent;
        const canRestoreCurveParameters = privateState &amp;&amp; privateState.curveConfigVersion === curveConfigVersion;
        if (privateState &amp;&amp; Number.isFinite(privateState.batteryPower)) state.batteryPower = privateState.batteryPower;
        if (privateState &amp;&amp; (privateState.flowColor === &quot;green&quot; || privateState.flowColor === &quot;orange&quot;)) state.flowColor = privateState.flowColor;
        if (privateState &amp;&amp; shapeNames.includes(privateState.pathShape)) state.pathShape = privateState.pathShape;
        curveParameterKeys.forEach((key) =&gt; {
          if (canRestoreCurveParameters &amp;&amp; Number.isFinite(privateState[key])) state[key] = privateState[key];
          if (canRestoreCurveParameters &amp;&amp; typeof privateState[key] === &quot;string&quot; &amp;&amp; /^#[0-9a-f]{6}$/i.test(privateState[key])) state[key] = privateState[key].toUpperCase();
        });
      } catch (_) {}

      try {
        const query = new URLSearchParams(globalThis.location.search);
        const queryPower = Number(query.get(&quot;power&quot;));
        const queryColor = query.get(&quot;color&quot;);
        if (query.has(&quot;power&quot;) &amp;&amp; Number.isFinite(queryPower)) state.batteryPower = queryPower;
        if (queryColor === &quot;green&quot; || queryColor === &quot;orange&quot;) state.flowColor = queryColor;
      } catch (_) {}

      const range = document.getElementById(&quot;fd-range&quot;);
      const rangeValue = document.getElementById(&quot;fd-range-value&quot;);
      const liveMeta = document.getElementById(&quot;fd-live-meta&quot;);
      const batteryValue = document.getElementById(&quot;fd-battery-value&quot;);
      const capNote = document.getElementById(&quot;fd-cap-note&quot;);
      const inverterModel = document.getElementById(&quot;fd-inverter-model&quot;);
      const hero = root.querySelector(&quot;.fd-hero&quot;);
      const batteryNode = root.querySelector(&quot;.fd-hero &gt; .fd-node:not(.fd-inverter)&quot;);
      const inverterNode = root.querySelector(&quot;.fd-inverter&quot;);
      const flowStream = root.querySelector(&quot;.fd-stream&quot;);
      const flowSvg = root.querySelector(&quot;.fd-stream-svg&quot;);
      const flowCanvas = document.getElementById(&quot;fd-flow-canvas&quot;);
      const flowContext = flowCanvas.getContext(&quot;2d&quot;);
      const trackPath = document.getElementById(&quot;fd-track-path&quot;);
      const trackGradient = document.getElementById(&quot;fd-track-gradient&quot;);
      const shapeSelect = document.getElementById(&quot;fd-shape-select&quot;);
      const pauseButton = document.getElementById(&quot;fd-pause&quot;);
      const svgNamespace = &quot;http://www.w3.org/2000/svg&quot;;
      let flowPathLength = 1;

      function createFlowPath() {
        const heroRect = hero.getBoundingClientRect();
        const batteryRect = batteryNode.getBoundingClientRect();
        const inverterRect = inverterNode.getBoundingClientRect();
        const battery = {
          left: batteryRect.left - heroRect.left,
          right: batteryRect.right - heroRect.left,
          top: batteryRect.top - heroRect.top,
          bottom: batteryRect.bottom - heroRect.top,
          centerY: batteryRect.top - heroRect.top + batteryRect.height / 2
        };
        const inverter = {
          left: inverterRect.left - heroRect.left,
          centerY: inverterRect.top - heroRect.top + inverterRect.height / 2
        };

        if (state.pathShape === &quot;lshape&quot;) {
          const startX = battery.left + (battery.right - battery.left) / 2;
          const endX = inverter.left;
          const direction = inverter.centerY &gt;= battery.bottom ? 1 : -1;
          const radius = Math.min(18, Math.abs(inverter.centerY - battery.bottom) / 2);
          return &quot;M &quot; + startX + &quot; &quot; + battery.bottom
            + &quot; V &quot; + (inverter.centerY - direction * radius)
            + &quot; Q &quot; + startX + &quot; &quot; + inverter.centerY + &quot; &quot; + (startX + radius) + &quot; &quot; + inverter.centerY
            + &quot; H &quot; + endX;
        }

        if (state.pathShape === &quot;sshape&quot;) {
          const startX = battery.right;
          const endX = inverter.left;
          const turnX = startX + (endX - startX) * 0.66;
          const radius = Math.min(18, (endX - startX) * 0.08);
          return &quot;M &quot; + startX + &quot; &quot; + battery.centerY
            + &quot; H &quot; + (turnX - radius)
            + &quot; Q &quot; + turnX + &quot; &quot; + battery.centerY + &quot; &quot; + turnX + &quot; &quot; + (battery.centerY + radius)
            + &quot; V &quot; + (inverter.centerY - radius)
            + &quot; Q &quot; + turnX + &quot; &quot; + inverter.centerY + &quot; &quot; + (turnX + radius) + &quot; &quot; + inverter.centerY
            + &quot; H &quot; + endX;
        }

        return &quot;M &quot; + battery.right + &quot; &quot; + battery.centerY
          + &quot; H &quot; + inverter.left;
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function formatPower(value) {
        const rounded = Math.round(value * 100) / 100;
        return String(rounded).replace(/\.0+$/, &quot;&quot;).replace(/(\.\d*?)0+$/, &quot;$1&quot;);
      }

      function hexToRgba(hex, alpha) {
        const value = String(hex).replace(&quot;#&quot;, &quot;&quot;);
        const red = parseInt(value.slice(0, 2), 16);
        const green = parseInt(value.slice(2, 4), 16);
        const blue = parseInt(value.slice(4, 6), 16);
        return &quot;rgba(&quot; + red + &quot;, &quot; + green + &quot;, &quot; + blue + &quot;, &quot; + alpha + &quot;)&quot;;
      }

      function updateParamControls() {
        root.querySelectorAll(&quot;.fd-param-range&quot;).forEach((input) =&gt; {
          const key = input.dataset.param;
          const value = Number(state[key]);
          const min = Number(input.min);
          const max = Number(input.max);
          const output = input.parentElement.querySelector(&quot;output&quot;);
          const unit = output ? output.dataset.unit || &quot;&quot; : &quot;&quot;;
          input.value = String(value);
          input.style.setProperty(&quot;--param-progress&quot;, ((value - min) / (max - min) * 100).toFixed(2) + &quot;%&quot;);
          if (output) {
            const precision = key === &quot;curveExponent&quot; ? 2 : Number.isInteger(value) ? 0 : 1;
            output.textContent = value.toFixed(precision) + (unit ? &quot; &quot; + unit : &quot;&quot;);
          }
        });

        root.querySelectorAll(&quot;.fd-color-input&quot;).forEach((input) =&gt; {
          const key = input.dataset.colorParam;
          const rawValue = String(state[key] || &quot;&quot;);
          const value = /^#[0-9a-f]{6}$/i.test(rawValue) ? rawValue.toUpperCase() : curveDefaults[key];
          const output = input.parentElement.querySelector(&quot;output&quot;);
          input.value = value.toLowerCase();
          if (output) output.textContent = value;
        });
      }

      function updateFlowGraphics() {
        const width = Math.max(1, hero.clientWidth);
        const height = Math.max(1, hero.clientHeight);
        const path = createFlowPath();
        const trackStops = Array.from(trackGradient.querySelectorAll(&quot;stop&quot;));
        const trackFadeIn = clamp(state.trackFadeIn / 100, 0, 1);
        const trackFadeOut = clamp(state.trackFadeOut / 100, 0, 1);

        flowSvg.setAttribute(&quot;viewBox&quot;, &quot;0 0 &quot; + width + &quot; &quot; + height);
        trackPath.setAttribute(&quot;d&quot;, path);
        trackPath.style.strokeWidth = state.trackWidth.toFixed(1) + &quot;px&quot;;
        const pixelRatio = Math.min(2, globalThis.devicePixelRatio || 1);
        flowCanvas.width = Math.round(width * pixelRatio);
        flowCanvas.height = Math.round(height * pixelRatio);
        flowContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        flowPathLength = trackPath.getTotalLength();

        const trackStart = trackPath.getPointAtLength(0);
        const trackEnd = trackPath.getPointAtLength(flowPathLength);
        trackGradient.setAttribute(&quot;x1&quot;, String(trackStart.x));
        trackGradient.setAttribute(&quot;y1&quot;, String(trackStart.y));
        trackGradient.setAttribute(&quot;x2&quot;, String(trackEnd.x));
        trackGradient.setAttribute(&quot;y2&quot;, String(trackEnd.y));

        const trackSettings = [
          [0, state.trackColor, 0],
          [trackFadeIn, state.trackColor, 1],
          [trackFadeOut, state.trackColor, 1],
          [1, state.trackColor, 0]
        ];
        trackSettings.forEach(([offset, color, opacity], index) =&gt; {
          trackStops[index].setAttribute(&quot;offset&quot;, String(offset));
          trackStops[index].setAttribute(&quot;stop-color&quot;, color);
          trackStops[index].setAttribute(&quot;stop-opacity&quot;, String(opacity));
        });
      }

      function metrics(power) {
        const absolute = Math.abs(Number(power) || 0);
        const ratio = clamp(absolute / state.modelMax, 0, 1);
        const visual = Math.pow(ratio, clamp(state.curveExponent, 0.1, 2));
        const active = absolute &gt; Math.max(0.1, state.modelMax * 0.005);
        const minWidth = Math.min(state.minLineWidth, state.maxLineWidth);
        const maxWidth = Math.max(state.minLineWidth, state.maxLineWidth);
        const minSpeed = Math.min(state.minSpeed, state.maxSpeed);
        const maxSpeed = Math.max(state.minSpeed, state.maxSpeed);
        const width = minWidth + (maxWidth - minWidth) * visual;
        const speed = active ? minSpeed + (maxSpeed - minSpeed) * visual : 0;
        const segment = Math.max(24, state.segmentLength - 12 * (1 - visual));
        const baseDuration = 3.2 - 1.6 * visual;
        const referenceCenterSpeed = (12 + 110) / 2;
        const currentCenterSpeed = (minSpeed + maxSpeed) / 2;
        const duration = active ? baseDuration * referenceCenterSpeed / Math.max(1, currentCenterSpeed) : 0;
        return {
          active,
          capped: absolute &gt; state.modelMax,
          ratio,
          width,
          speed,
          segment,
          duration
        };
      }

      let nextFlowTimer = null;
      let flowResizeObserver = null;
      let flowAnimationFrame = null;
      const flowSegments = new Set();

      function clearStream() {
        if (nextFlowTimer) clearTimeout(nextFlowTimer);
        nextFlowTimer = null;
        if (flowAnimationFrame) cancelAnimationFrame(flowAnimationFrame);
        flowAnimationFrame = null;
        flowSegments.clear();
        flowContext.clearRect(0, 0, flowCanvas.width, flowCanvas.height);
      }

      function createFlowColorModel() {
        const orange = state.flowColor === &quot;orange&quot;;
        const startColor = orange ? state.acGradientStart : state.dcGradientStart;
        const mainColor = orange ? state.acGradientMain : state.dcGradientMain;
        const endColor = orange ? state.acGradientEnd : state.dcGradientEnd;
        const startAt = (orange ? state.acGradientStartPosition : state.dcGradientStartPosition) / 100;
        const mainAt = (orange ? state.acGradientMainPosition : state.dcGradientMainPosition) / 100;
        const startOpacity = orange ? state.acGradientStartOpacity / 100 : state.dcGradientOpacity / 100;
        const bodyOpacity = orange ? 1 : state.dcGradientOpacity / 100;
        return [
          [0, startColor, 0],
          [startAt, startColor, startOpacity],
          [mainAt, mainColor, bodyOpacity],
          [0.84, mainColor, bodyOpacity],
          [1, endColor, 0]
        ];
      }

      function parseHexColor(hex) {
        const value = hex.replace(&quot;#&quot;, &quot;&quot;);
        return {
          red: parseInt(value.slice(0, 2), 16),
          green: parseInt(value.slice(2, 4), 16),
          blue: parseInt(value.slice(4, 6), 16)
        };
      }

      function flowColorAt(position, colorModel) {
        const t = clamp(position, 0, 1);
        let left = colorModel[0];
        let right = colorModel[colorModel.length - 1];
        for (let index = 1; index &lt; colorModel.length; index += 1) {
          if (t &lt;= colorModel[index][0]) {
            left = colorModel[index - 1];
            right = colorModel[index];
            break;
          }
        }
        const span = Math.max(0.0001, right[0] - left[0]);
        const blend = clamp((t - left[0]) / span, 0, 1);
        const start = parseHexColor(left[1]);
        const end = parseHexColor(right[1]);
        const red = Math.round(start.red + (end.red - start.red) * blend);
        const green = Math.round(start.green + (end.green - start.green) * blend);
        const blue = Math.round(start.blue + (end.blue - start.blue) * blend);
        const alpha = left[2] + (right[2] - left[2]) * blend;
        return &quot;rgba(&quot; + red + &quot;, &quot; + green + &quot;, &quot; + blue + &quot;, &quot; + alpha + &quot;)&quot;;
      }

      function drawFlowSegment(segment, progress) {
        const segmentLength = flowPathLength * clamp(segment.segmentFraction, 0, 1);
        const travelStart = -segmentLength + progress * (flowPathLength + segmentLength);
        const travelEnd = travelStart + segmentLength;
        const visibleStart = Math.max(0, travelStart);
        const visibleEnd = Math.min(flowPathLength, travelEnd);
        if (visibleEnd &lt;= visibleStart) return;

        const steps = clamp(Math.ceil((visibleEnd - visibleStart) / 5), 10, 120);
        flowContext.lineWidth = segment.width;
        flowContext.lineCap = &quot;round&quot;;
        flowContext.lineJoin = &quot;round&quot;;

        for (let index = 0; index &lt; steps; index += 1) {
          const firstDistance = visibleStart + (visibleEnd - visibleStart) * index / steps;
          const secondDistance = visibleStart + (visibleEnd - visibleStart) * (index + 1) / steps;
          const firstPoint = trackPath.getPointAtLength(firstDistance);
          const secondPoint = trackPath.getPointAtLength(secondDistance);
          const centerDistance = (firstDistance + secondDistance) / 2;
          const colorPosition = (centerDistance - travelStart) / Math.max(1, segmentLength);
          flowContext.strokeStyle = flowColorAt(colorPosition, segment.colorModel);
          flowContext.beginPath();
          flowContext.moveTo(firstPoint.x, firstPoint.y);
          flowContext.lineTo(secondPoint.x, secondPoint.y);
          flowContext.stroke();
        }
      }

      function drawFlowFrame(now) {
        flowContext.clearRect(0, 0, flowCanvas.width, flowCanvas.height);
        flowSegments.forEach((segment) =&gt; {
          const progress = Number.isFinite(segment.staticProgress)
            ? segment.staticProgress
            : (now - segment.startedAt) / segment.duration;
          if (!Number.isFinite(segment.staticProgress) &amp;&amp; progress &gt;= 1) {
            flowSegments.delete(segment);
            return;
          }
          drawFlowSegment(segment, clamp(progress, 0, 1));
        });

        flowAnimationFrame = flowSegments.size
          ? requestAnimationFrame(drawFlowFrame)
          : null;
      }

      function ensureFlowAnimation() {
        if (flowAnimationFrame == null) flowAnimationFrame = requestAnimationFrame(drawFlowFrame);
      }

      function createFlowSegment(m, staticProgress) {
        const segment = {
          duration: m.duration * 1000,
          segmentFraction: m.segment / 100,
          width: m.width,
          colorModel: createFlowColorModel(),
          startedAt: performance.now(),
          staticProgress
        };
        flowSegments.add(segment);
        ensureFlowAnimation();
        return segment;
      }

      function startStream(m) {
        clearStream();
        if (!m.active) return;

        if (state.isPaused) {
          createFlowSegment(m, 0.38);
          return;
        }

        const duration = m.duration * 1000;
        const reducedMotion = globalThis.matchMedia &amp;&amp; globalThis.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;).matches;
        createFlowSegment(m, reducedMotion ? 0.38 : undefined);
        if (reducedMotion) return;

        const spawnRatio = clamp(1 - state.lineOverlap / 100, 0.55, 1);
        const spawnNext = () =&gt; {
          createFlowSegment(m);
          nextFlowTimer = setTimeout(spawnNext, duration * spawnRatio);
        };

        nextFlowTimer = setTimeout(spawnNext, duration * spawnRatio);
      }

      function persist() {
        try {
          const writer = globalThis.openai &amp;&amp; globalThis.openai.setWidgetState;
          if (typeof writer !== &quot;function&quot;) return;
          const curveParameters = Object.fromEntries(curveParameterKeys.map((key) =&gt; [key, state[key]]));
          const result = writer({
            modelContent: {
              modelMaxKw: state.modelMax,
              batteryPowerKw: state.batteryPower,
              flowColor: state.flowColor,
              pathShape: state.pathShape,
              curveParameters
            },
            privateContent: {
              modelMax: state.modelMax,
              batteryPower: state.batteryPower,
              flowColor: state.flowColor,
              pathShape: state.pathShape,
              curveConfigVersion,
              ...curveParameters
            }
          });
          if (result &amp;&amp; typeof result.catch === &quot;function&quot;) result.catch(() =&gt; {});
        } catch (_) {}
      }

      function render() {
        const m = metrics(state.batteryPower);
        const signedPower = state.batteryPower === 0 ? &quot;0&quot; : &quot;−&quot; + formatPower(state.batteryPower);
        const percent = Math.round(m.ratio * 100);

        range.value = String(state.batteryPower);
        range.style.setProperty(&quot;--fd-progress&quot;, (m.ratio * 100).toFixed(2) + &quot;%&quot;);
        rangeValue.textContent = signedPower + &quot; kW&quot;;
        liveMeta.textContent = state.isPaused &amp;&amp; m.active
          ? &quot;Paused&quot;
          : m.active
          ? m.width.toFixed(1) + &quot; px · &quot; + Math.round(m.speed) + &quot; px/s&quot;
          : &quot;Static&quot;;
        batteryValue.textContent = signedPower;
        capNote.textContent = m.capped ? &quot;Exceeds &quot; + state.modelMax + &quot; kW · visual max&quot; : percent + &quot;% of rated power&quot;;
        capNote.classList.toggle(&quot;is-capped&quot;, m.capped);
        inverterModel.textContent = &quot;iHybrid &quot; + state.modelMax + &quot;K&quot;;
        root.dataset.flowColor = state.flowColor;
        root.dataset.flowShape = state.pathShape;
        shapeSelect.value = state.pathShape;
        const flowStart = state.flowColor === &quot;orange&quot;
          ? hexToRgba(state.acGradientStart, state.acGradientStartOpacity / 100)
          : hexToRgba(state.dcGradientStart, state.dcGradientOpacity / 100);
        const flowMain = state.flowColor === &quot;orange&quot;
          ? state.acGradientMain
          : hexToRgba(state.dcGradientMain, state.dcGradientOpacity / 100);
        const flowEnd = state.flowColor === &quot;orange&quot;
          ? state.acGradientEnd
          : hexToRgba(state.dcGradientEnd, state.dcGradientOpacity / 100);
        const flowStartAt = state.flowColor === &quot;orange&quot; ? state.acGradientStartPosition : state.dcGradientStartPosition;
        const flowMainAt = state.flowColor === &quot;orange&quot; ? state.acGradientMainPosition : state.dcGradientMainPosition;
        root.style.setProperty(&quot;--lab-track&quot;, state.trackColor);
        root.style.setProperty(&quot;--fd-track-fade-in&quot;, state.trackFadeIn + &quot;%&quot;);
        root.style.setProperty(&quot;--fd-track-fade-out&quot;, state.trackFadeOut + &quot;%&quot;);
        root.style.setProperty(&quot;--fd-flow-start&quot;, flowStart);
        root.style.setProperty(&quot;--fd-flow-main&quot;, flowMain);
